openapi: 3.0.3
info:
  title: Pokémon App — HU-02 Detailed View
  version: 0.1.0
  description: |
    Public Pokémon detail by National Dex id. Backend owns /api/v1.
    Nginx forwards /api/ unchanged. Errors are RFC 7807 Problem Details.
servers:
  - url: http://localhost:8080
    description: Backend direct
  - url: http://localhost:3000
    description: Via UI proxy (path unchanged)
paths:
  /api/v1/pokemon/{id}:
    get:
      operationId: getPokemonDetail
      summary: Get Pokémon detail (National Dex id)
      tags:
        - Pokemon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: National Dex number
      responses:
        "200":
          description: Pokémon detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PokemonDetail"
              examples:
                bulbasaur:
                  value:
                    nationalNumber: 1
                    name: Bulbasaur
                    category: Seed Pokémon
                    types: [grass, poison]
                    heightM: 0.7
                    weightKg: 6.9
                    abilities:
                      - name: overgrow
                        hidden: false
                      - name: chlorophyll
                        hidden: true
                    generation: generation-i
                    imageUrl: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png
                    stats:
                      hp: 45
                      attack: 49
                      defense: 49
                      specialAttack: 65
                      specialDefense: 65
                      speed: 45
                      total: 318
                    flavorText:
                      text: A strange seed was planted on its back at birth. The plant sprouts and grows with this Pokémon.
                      version: red
                    evolution:
                      nationalNumber: 1
                      name: Bulbasaur
                      imageUrl: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png
                      isCurrent: true
                      children:
                        - trigger: level-up
                          minLevel: 16
                          itemSlug: null
                          node:
                            nationalNumber: 2
                            name: Ivysaur
                            imageUrl: https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/2.png
                            isCurrent: false
                            children: []
        "400":
          description: Invalid id (non-numeric or &lt; 1)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Pokémon not found in the catalog
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "502":
          description: Upstream catalog unavailable or timed out
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    AbilityRef:
      type: object
      required: [name, hidden]
      properties:
        name:
          type: string
          example: overgrow
        hidden:
          type: boolean
    PokemonStats:
      type: object
      required: [hp, attack, defense, specialAttack, specialDefense, speed, total]
      properties:
        hp: { type: integer }
        attack: { type: integer }
        defense: { type: integer }
        specialAttack: { type: integer }
        specialDefense: { type: integer }
        speed: { type: integer }
        total: { type: integer }
    FlavorText:
      type: object
      nullable: true
      properties:
        text:
          type: string
        version:
          type: string
          description: Game version slug
    EvolutionChild:
      type: object
      required: [node]
      properties:
        trigger:
          type: string
          nullable: true
          description: Catalog trigger slug from first evolution_details entry
        minLevel:
          type: integer
          nullable: true
        itemSlug:
          type: string
          nullable: true
        node:
          $ref: "#/components/schemas/EvolutionNode"
    EvolutionNode:
      type: object
      required: [nationalNumber, name, isCurrent, children]
      properties:
        nationalNumber:
          type: integer
          minimum: 1
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
          format: uri
        isCurrent:
          type: boolean
          description: True when this node is the requested Pokémon
        children:
          type: array
          items:
            $ref: "#/components/schemas/EvolutionChild"
    PokemonDetail:
      type: object
      required:
        - nationalNumber
        - name
        - types
        - heightM
        - weightKg
        - abilities
        - generation
        - stats
        - evolution
      properties:
        nationalNumber:
          type: integer
          minimum: 1
        name:
          type: string
        category:
          type: string
          nullable: true
        types:
          type: array
          items:
            type: string
        heightM:
          type: number
          multipleOf: 0.1
          example: 0.7
        weightKg:
          type: number
          multipleOf: 0.1
          example: 6.9
        abilities:
          type: array
          items:
            $ref: "#/components/schemas/AbilityRef"
        generation:
          type: string
          example: generation-i
        imageUrl:
          type: string
          nullable: true
          format: uri
        stats:
          $ref: "#/components/schemas/PokemonStats"
        flavorText:
          $ref: "#/components/schemas/FlavorText"
        evolution:
          $ref: "#/components/schemas/EvolutionNode"
    ProblemDetail:
      type: object
      description: RFC 7807
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
