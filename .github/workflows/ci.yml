name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - run: ./mvnw -B verify
      - name: Build backend image
        working-directory: ${{ github.workspace }}
        run: docker build backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build frontend image
        working-directory: ${{ github.workspace }}
        run: docker build -t pokemonapp-frontend:ci frontend
      - name: Smoke test frontend image
        working-directory: ${{ github.workspace }}
        run: |
          docker run -d --name frontend-smoke \
            -p 18080:80 \
            --add-host backend:127.0.0.1 \
            pokemonapp-frontend:ci
          trap 'docker stop frontend-smoke && docker rm frontend-smoke' EXIT
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:18080/); then
              echo "$body" | grep -q 'id="root"'
              echo "$body" | grep -q 'Pokéfolio'
              exit 0
            fi
            sleep 1
          done
          echo "frontend smoke test failed" >&2
          docker logs frontend-smoke >&2 || true
          exit 1
