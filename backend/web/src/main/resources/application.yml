spring:
  application:
    name: pokemonapp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pokemon}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true

pokemonapp:
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout: 2s
    read-timeout: 5s
    cache:
      ttl: 24h
      id-max-size: 2048
      list-max-size: 256
  security:
    jwt:
      # Empty fallback only so missing JWT_SECRET fails with JwtProperties' clear message.
      secret: ${JWT_SECRET:}
      expiry: 1h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
